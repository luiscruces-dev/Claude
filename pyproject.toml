[project]
name = "story-to-video"
version = "0.1.0"
description = "Convierte cuentos en texto en videos narrados usando IA (guion con Claude, voz con ElevenLabs, video con Veo)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
